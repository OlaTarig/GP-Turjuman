<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Turjuman - Open Meeting</title>
</head>

<body style="font-family: Arial; padding: 24px; background:#fffaf5;">
<h2 style="color:#2D3142;">Opening meeting…</h2>
<p style="color:#555;">If the app doesn't open automatically, tap the button below.</p>

<button id="openBtn"
        style="padding:12px 16px; font-size:16px; border:none; border-radius:12px; background:#FFB382; color:white; font-weight:700;">
    Open in Turjuman App
</button>

<script>
    // URL: https://turjuman-63e17.web.app/meeting/<MEETING_ID>
    const parts = window.location.pathname.split('/').filter(Boolean);
    const meetingId = parts[parts.length - 1];

    // keep same URL; once App Links is configured, Android will open the app
    const url = `https://turjuman-63e17.web.app/meeting/${meetingId}`;

    document.getElementById('openBtn').onclick = () => {
      window.location.href = url;
    };

    // try auto-open
    window.location.href = url;
</script>
</body>
</html>
